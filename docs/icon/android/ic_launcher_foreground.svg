<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Android adaptive icon, foreground layer (the 1024 canvas is the 108 dp layer). Made from docs/icon/icon.svg (the same scene at 79%,
