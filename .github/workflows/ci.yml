# LAS Recomp's checks: the app (build/lasrecomp: everything but the game code, which the start screen builds on the
# player's machine) builds on Linux, Linux aarch64, macOS, Windows and Windows on ARM, and the tests that need no game files or GPU run: the FP/SIMD
# lowering against a CPU emulator (tools/test_simd.py, x86-64 Linux), the shader translator's GLSL against shaderc +
# SPIRV-Tools (tools/test_translate.sh, Windows), its instruction semantics on the CPU (tools/test_translate_ops.sh,
# Linux / macOS) and the same programs' Vulkan GLSL through spirv-val (tools/test_spirv_val.sh, Linux). Nothing is published. Feature tests that need no game files go in as steps here, not as workflows of
# their own.
name: CI
on:
  pull_request:
  push:
    branches: ['main', 'beta_*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # (a newer push to the same branch / PR replaces a run still going)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (docs/linux.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make pkg-config cmake ninja-build \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libvulkan-dev libshaderc-dev \
            libvulkan-memory-allocator-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          # (SDL's video / audio / input backends: the same -dev packages as tools/linux/Containerfile)
      # SDL3 3.4 or newer (PNG load / save); Ubuntu ships an older one: the AppImage's pinned version
      # (tools/linux/build_deps.sh), built once and cached
      - name: SDL3 cache
        id: sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-3.4.16-ubuntu-24.04
      - name: SDL3 3.4.16 from source
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  sdl.tar.gz" | sha256sum -c
          tar xf sdl.tar.gz
          cmake -S SDL3-3.4.16 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build
          cmake --install sdl-build
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp DEPS="$HOME/sdl3"
      - name: Build cache and resume tests
        run: |
          python3 tools/test_build_cache.py
          python3 tools/test_gamebuild_resume.py
      - name: Save I/O regression tests
        run: python3 tools/test_save.py
      - name: Movie extractor lifecycle regression
        run: |
          clang -std=gnu11 -O1 tools/test_movie_extractor.c $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale) -pthread -o build/test-movie-extractor
          mkdir -p build/movie-test
          build/test-movie-extractor build/movie-test
      - name: Kernel condition-variable regression
        run: |
          clang -O2 -pthread tools/test_condvar.c -o build/test-condvar
          build/test-condvar
      - name: Settings regression tests
        run: python3 tools/test_settings.py
      - name: Game-files delete guard (links, outside the data folder)
        run: DEPS="$HOME/sdl3" python3 tools/test_delete_guard.py
      - name: Data folder move (cut off at every step)
        run: DEPS="$HOME/sdl3" python3 tools/test_data_move.py
      - name: Dynamic resolution controller (simulated GPU)
        run: python3 tools/test_dynres.py
      - name: Frame pacing (simulated frames, hitches and slow machines)
        run: python3 tools/test_pace.py
      - name: Controller light colours
        run: |
          clang -std=gnu11 -O1 tools/test_led.c -lm -o build/test-led
          build/test-led
      - name: Update check tags (order and labels)
        run: |
          clang++ -std=c++17 -O1 tools/test_update_tags.cpp -o build/test-update-tags
          build/test-update-tags
      - name: Controller rumble (HID bridge to SDL, fake gamepad)
        run: |
          clang -std=gnu11 -O2 -I"$HOME/sdl3/include" tools/test_rumble.c -L"$HOME/sdl3/lib" -Wl,-rpath,"$HOME/sdl3/lib" -lSDL3 -lm -o build/test-rumble
          build/test-rumble
      - name: Controller in use (two virtual gamepads, #455)
        run: |
          clang -std=gnu11 -O2 -I"$HOME/sdl3/include" tools/test_active_pad.c -L"$HOME/sdl3/lib" -Wl,-rpath,"$HOME/sdl3/lib" -lSDL3 -lm -o build/test-active-pad
          build/test-active-pad
      - name: Vulkan fence sequence regression
        run: python3 tools/test_fence_sequence.py
      - name: Guest heap import on low-memory machines
        run: python3 tools/test_gmem_lowmem.py
      - name: Vulkan validation failure regression
        run: python3 tools/test_vulkan_validation.py
      - name: Vulkan overlay command buffer (recorder thread)
        run: python3 tools/test_vulkan_overlay.py
      - name: SIMD rounding and host-state regression
        run: |
          clang -std=gnu11 -O1 -mfma -pthread tools/test_simd_rounding.c -lm -o build/test-simd-rounding
          build/test-simd-rounding
      - name: Game address table tests
        run: python3 tools/test_game_addresses.py
      - name: Randomizer Field region table
        run: python3 tools/test_field_regions.py
      - name: Randomizer room shuffle ledges
        run: python3 tools/test_room_ledges.py
      - name: Vulkan synchronization failure regression
        run: python3 tools/test_vulkan_sync_errors.py
      - name: Shader translator instruction semantics
        run: tools/test_translate_ops.sh
      # (the same programs as vertex / fragment / compute GLSL -> glslc -> spirv-val, Vulkan 1.3; the shipped shader
      # list is only hashes of the game's shaders, so these synthetic programs stand in for it)
      - name: Shader translator SPIR-V validation (Vulkan 1.3)
        run: |
          sudo apt-get install -y --no-install-recommends glslc spirv-tools
          tools/test_spirv_val.sh
      - name: FP/SIMD lowering vs a CPU emulator (a sample)
        run: |
          python3 -m venv tools/venv && tools/venv/bin/pip install -q unicorn capstone lz4
          tools/venv/bin/python tools/test_simd.py --encodings 3000 --cases 4 --jobs "$(nproc)"
      # (the moving guest window the Android port needs, runtime/rt.h: the generator's --dyn-base output, and the app
      # built with it, so the desktop build stays as it was and the other one keeps compiling)
      - name: Generator --dyn-base (moving guest window)
        run: tools/venv/bin/python tools/test_dyn_base.py
      - name: App builds with DYN_BASE=1
        run: make -j"$(nproc)" build/dyn/lasrecomp B=build/dyn DYN_BASE=1 DEPS="$HOME/sdl3"


  # Linux aarch64 (experimental builds): the same app build and tests natively on an arm64 runner. Left out: the
  # x86 SIMD rounding test (-mfma), the FP/SIMD lowering check (x86 lowers to C, aarch64 keeps the inline asm) and
  # the shader translator checks (the same on every platform; the x86-64 job runs them).
  linux-aarch64:
    runs-on: ubuntu-24.04-arm
    steps:
