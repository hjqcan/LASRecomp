# LAS Recomp's checks: the app (build/lasrecomp: everything but the game code, which the start screen builds on the
# player's machine) builds on Linux, macOS and Windows, and the tests that need no game files or GPU run: the FP/SIMD
# lowering against a CPU emulator (tools/test_simd.py, x86-64 Linux) and the shader translator's GLSL against shaderc +
# SPIRV-Tools (tools/test_translate.sh, Windows). Nothing is published. Feature tests that need no game files go in as
# steps here, not as workflows of their own.
name: CI
on:
  pull_request:
  push:
    branches: ['main', 'beta_*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:  # (a newer push to the same branch / PR replaces a run still going)
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Packages (docs/linux.md)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang lld make pkg-config cmake ninja-build \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev libvulkan-dev libshaderc-dev \
            libvulkan-memory-allocator-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxfixes-dev libxtst-dev \
            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          # (SDL's video / audio / input backends: the same -dev packages as tools/linux/Containerfile)
      # SDL3 3.4 or newer (PNG load / save); Ubuntu ships an older one: the AppImage's pinned version
      # (tools/linux/build_deps.sh), built once and cached
      - name: SDL3 cache
        id: sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-3.4.16-ubuntu-24.04
      - name: SDL3 3.4.16 from source
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  sdl.tar.gz" | sha256sum -c
          tar xf sdl.tar.gz
          cmake -S SDL3-3.4.16 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build
          cmake --install sdl-build
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp DEPS="$HOME/sdl3"
      - name: FP/SIMD lowering vs a CPU emulator (a sample)
        run: |
          python3 -m venv tools/venv && tools/venv/bin/pip install -q unicorn capstone lz4
          tools/venv/bin/python tools/test_simd.py --encodings 3000 --cases 4 --jobs "$(nproc)"

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install sdl3 ffmpeg
      - name: App builds
        run: make -j"$(sysctl -n hw.ncpu)" build/lasrecomp

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # MSYS2 UCRT64 with the packages tools/setup_windows.ps1 installs (minus the debugger / validation layers),
      # binutils for windres (the exe's icon), git for tools/test_translate.sh
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git
          pacboy: clang:p lld:p binutils:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp.exe
      # (GLSL only: the script's MSL comparison needs a reference commit that isn't in the history any more; REF=HEAD
      # just satisfies it. The GLSL half - every fuzzed translation compiles and validates - is the check)
      - name: Shader translator fuzz (GLSL)
        run: REF=HEAD tools/test_translate.sh 4000 "$(nproc)" glsl
