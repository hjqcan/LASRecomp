            libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libegl-dev libgl-dev libdrm-dev libgbm-dev \
            libpulse-dev libasound2-dev libpipewire-0.3-dev libdbus-1-dev libudev-dev libibus-1.0-dev
          # (SDL's video / audio / input backends: the same -dev packages as tools/linux/Containerfile)
      # SDL3 3.4 or newer (PNG load / save); Ubuntu ships an older one: the AppImage's pinned version
      # (tools/linux/build_deps.sh), built once and cached
      - name: SDL3 cache
        id: sdl
        uses: actions/cache@v4
        with:
          path: ~/sdl3
          key: sdl3-3.4.16-ubuntu-24.04-arm
      - name: SDL3 3.4.16 from source
        if: steps.sdl.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-3.4.16/SDL3-3.4.16.tar.gz
          echo "7322236cd12090c3eb40b9728be4d49c76f66ad17d04369584d4ecad5cf77c68  sdl.tar.gz" | sha256sum -c
          tar xf sdl.tar.gz
          cmake -S SDL3-3.4.16 -B sdl-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$HOME/sdl3" \
                -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build sdl-build
          cmake --install sdl-build
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp DEPS="$HOME/sdl3"
      - name: Build cache and resume tests
        run: |
          python3 tools/test_build_cache.py
          python3 tools/test_gamebuild_resume.py
      - name: Save I/O regression tests
        run: python3 tools/test_save.py
      - name: Movie extractor lifecycle regression
        run: |
          clang -std=gnu11 -O1 tools/test_movie_extractor.c $(pkg-config --cflags --libs libavformat libavcodec libavutil libswscale) -pthread -o build/test-movie-extractor
          mkdir -p build/movie-test
          build/test-movie-extractor build/movie-test
      - name: Kernel condition-variable regression
        run: |
          clang -O2 -pthread tools/test_condvar.c -o build/test-condvar
          build/test-condvar
      - name: Settings regression tests
        run: python3 tools/test_settings.py
      - name: Game-files delete guard (links, outside the data folder)
        run: DEPS="$HOME/sdl3" python3 tools/test_delete_guard.py
      - name: Data folder move (cut off at every step)
        run: DEPS="$HOME/sdl3" python3 tools/test_data_move.py
      - name: Dynamic resolution controller (simulated GPU)
        run: python3 tools/test_dynres.py
      - name: Frame pacing (simulated frames, hitches and slow machines)
        run: python3 tools/test_pace.py
      - name: Controller light colours
        run: |
          clang -std=gnu11 -O1 tools/test_led.c -lm -o build/test-led
          build/test-led
      - name: Update check tags (order and labels)
        run: |
          clang++ -std=c++17 -O1 tools/test_update_tags.cpp -o build/test-update-tags
          build/test-update-tags
      - name: Controller rumble (HID bridge to SDL, fake gamepad)
        run: |
          clang -std=gnu11 -O2 -I"$HOME/sdl3/include" tools/test_rumble.c -L"$HOME/sdl3/lib" -Wl,-rpath,"$HOME/sdl3/lib" -lSDL3 -lm -o build/test-rumble
          build/test-rumble
      - name: Controller in use (two virtual gamepads, #455)
        run: |
          clang -std=gnu11 -O2 -I"$HOME/sdl3/include" tools/test_active_pad.c -L"$HOME/sdl3/lib" -Wl,-rpath,"$HOME/sdl3/lib" -lSDL3 -lm -o build/test-active-pad
          build/test-active-pad
      - name: Vulkan fence sequence regression
        run: python3 tools/test_fence_sequence.py
      - name: Guest heap import on low-memory machines
        run: python3 tools/test_gmem_lowmem.py
      - name: Vulkan validation failure regression
        run: python3 tools/test_vulkan_validation.py
      - name: Vulkan overlay command buffer (recorder thread)
        run: python3 tools/test_vulkan_overlay.py
      - name: Game address table tests
        run: python3 tools/test_game_addresses.py
      - name: Randomizer Field region table
        run: python3 tools/test_field_regions.py
      - name: Randomizer room shuffle ledges
        run: python3 tools/test_room_ledges.py
      - name: Vulkan synchronization failure regression
        run: python3 tools/test_vulkan_sync_errors.py
  macos:
    runs-on: [self-hosted, macos-vm]  # (a fresh Tart VM per job on the maintainer's Mac, deleted after)
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: brew install sdl3 ffmpeg
      - name: App builds
        run: make -j"$(sysctl -n hw.ncpu)" build/lasrecomp
      - name: SIMD rounding and host-state regression
        run: |
          clang -std=gnu11 -O1 -pthread tools/test_simd_rounding.c -o build/test-simd-rounding
          build/test-simd-rounding
      - name: Build cache and resume tests
        run: |
          python3 tools/test_build_cache.py
          python3 tools/test_gamebuild_resume.py
      - name: Save I/O regression tests
        run: python3 tools/test_save.py
      - name: Movie extractor lifecycle regression
        run: |
          clang -std=gnu11 -O1 -I"$(brew --prefix ffmpeg)/include" -L"$(brew --prefix ffmpeg)/lib" tools/test_movie_extractor.c -lavformat -lavcodec -lavutil -lswscale -pthread -o build/test-movie-extractor
          mkdir -p build/movie-test
          build/test-movie-extractor build/movie-test
      - name: Kernel condition-variable regression
        run: |
          clang -O2 -pthread tools/test_condvar.c -o build/test-condvar
          build/test-condvar
      - name: Settings regression tests
        run: python3 tools/test_settings.py
      - name: Game-files delete guard (links, outside the data folder)
        run: python3 tools/test_delete_guard.py
      - name: Data folder move (cut off at every step)
        run: python3 tools/test_data_move.py
      - name: Dynamic resolution controller (simulated GPU)
        run: python3 tools/test_dynres.py
      - name: Frame pacing (simulated frames, hitches and slow machines)
        run: python3 tools/test_pace.py
      - name: Controller light colours
        run: |
          clang -std=gnu11 -O1 tools/test_led.c -lm -o build/test-led
          build/test-led
      - name: Update check tags (order and labels)
        run: |
          clang++ -std=c++17 -O1 tools/test_update_tags.cpp -o build/test-update-tags
          build/test-update-tags
      - name: Controller rumble (HID bridge to SDL, fake gamepad)
        run: |
          clang -std=gnu11 -O2 -I"$(brew --prefix sdl3)/include" -L"$(brew --prefix sdl3)/lib" tools/test_rumble.c -lSDL3 -o build/test-rumble
          build/test-rumble
      - name: Controller in use (two virtual gamepads, #455)
        run: |
          clang -std=gnu11 -O2 -I"$(brew --prefix sdl3)/include" -L"$(brew --prefix sdl3)/lib" tools/test_active_pad.c -lSDL3 -o build/test-active-pad
          build/test-active-pad
      - name: Game address table tests
        run: python3 tools/test_game_addresses.py
      - name: Vulkan synchronization failure regression
        run: python3 tools/test_vulkan_sync_errors.py
      - name: Shader translator instruction semantics
        run: tools/test_translate_ops.sh

      - name: macOS launch smoke-test regressions
        run: python3 tools/test_macos_app_smoke.py
      # Exercise make app's pinned libraries and rewritten load paths, not the Homebrew-linked build above.
      - name: macOS app dependencies cache
        uses: actions/cache@v4
        with:
          path: |
            build/deps
            !build/deps/src
          key: deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_deps_macos.sh') }}
      - name: Finished macOS app
        run: |
          brew install ninja
          make deps
          make rando-helper && make gen-helper
          tools/fetch_zig.sh
          make -j"$(sysctl -n hw.ncpu)" app
      - name: Finished macOS app launches (dynamic-library loading)
        run: python3 tools/smoke_macos_app.py "build/LAS Recomp.app"

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      # (Windows PowerShell 5.1, what the setup instructions run: a parse error stops the whole script)
      - name: PowerShell scripts parse
        shell: powershell
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem tools\*.ps1) {
            $err = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$err)
            foreach ($e in $err) { Write-Host "::error file=tools/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"; $bad = 1 }
          }
          exit $bad
      # MSYS2 UCRT64 with the packages tools/setup_windows.ps1 installs (minus the debugger / validation layers),
      # binutils for windres (the exe's icon), git for tools/test_translate.sh
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make git python
          pacboy: clang:p lld:p binutils:p python:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp.exe
      - name: Build cache and resume tests
        run: |
          python3 tools/test_build_cache.py
          python3 tools/test_gamebuild_resume.py
          python3 tools/test_windows_processes.py
      - name: Save I/O regression tests
        run: python3 tools/test_save.py
      - name: Game-files delete guard (junctions, outside the data folder)
        run: python3 tools/test_delete_guard.py
      - name: Data folder move (cut off at every step)
        run: python3 tools/test_data_move.py
      - name: Movie extractor lifecycle regression
        run: |
          clang -std=gnu11 -O1 tools/test_movie_extractor.c -lavformat -lavcodec -lavutil -lswscale -o build/test-movie-extractor.exe
          mkdir -p build/movie-test
          build/test-movie-extractor.exe build/movie-test
      - name: Kernel condition-variable regression
        run: |
          clang -O2 -pthread tools/test_condvar.c -o build/test-condvar.exe
          build/test-condvar.exe
      - name: Controller rumble (HID bridge to SDL, fake gamepad)
        run: |
          clang -std=gnu11 -O2 $(pkg-config --cflags sdl3) tools/test_rumble.c $(pkg-config --libs sdl3) -o build/test-rumble.exe
          build/test-rumble.exe
      - name: Controller in use (two virtual gamepads, #455)
        run: |
          clang -std=gnu11 -O2 $(pkg-config --cflags sdl3) tools/test_active_pad.c $(pkg-config --libs sdl3) -o build/test-active-pad.exe
          build/test-active-pad.exe
      - name: Vulkan fence sequence regression
        run: python tools/test_fence_sequence.py
      - name: Guest heap import on low-memory machines
        run: python tools/test_gmem_lowmem.py
      - name: Vulkan validation failure regression
        run: python tools/test_vulkan_validation.py
      - name: Vulkan overlay command buffer (recorder thread)
        run: python tools/test_vulkan_overlay.py
      - name: Windows guest thread stack regression
        run: |
          clang -std=gnu11 -O1 tools/test_windows_thread_stack.c -lpsapi -o build/test-thread-stack.exe
          build/test-thread-stack.exe
      - name: Windows lazy guest-memory commit race regression
        run: |
          clang -std=gnu11 -O1 -D_FILE_OFFSET_BITS=64 -D_POSIX_THREAD_SAFE_FUNCTIONS -DWIN32_LEAN_AND_MEAN -DNOMINMAX \
            tools/test_windows_lazy_commit.c -lwinmm -lole32 -lshell32 -o build/test-lazy-commit.exe
          build/test-lazy-commit.exe
      - name: Windows session log regression
        run: python tools/test_windows_logs.py
      - name: SIMD rounding and host-state regression
        run: |
          clang -std=gnu11 -O1 -mfma -pthread tools/test_simd_rounding.c -o build/test-simd-rounding.exe
          build/test-simd-rounding.exe
      # (GLSL only: the script's MSL comparison needs a reference commit that isn't in the history any more; REF=HEAD
      # just satisfies it. The GLSL half - every fuzzed translation compiles and validates - is the check)
      - name: Shader translator fuzz (GLSL)
        run: REF=HEAD tools/test_translate.sh 4000 "$(nproc)" glsl
      # (the branch stacks as arrays: the runtime's default on every GPU but Intel - shader.h maxwell_glsl_stack_vars)
      - name: Shader translator fuzz (GLSL, branch stacks as arrays)
        run: TT_STACK_ARRAYS=1 REF=HEAD tools/test_translate.sh 2000 "$(nproc)" glsl
      # (no heap import: every stage through the address table, over copies - shader.h maxwell_gmem_mirror, #483)
      - name: Shader translator fuzz (GLSL, guest memory through copies)
        run: TT_GMEM_MIRROR=1 REF=HEAD tools/test_translate.sh 2000 "$(nproc)" glsl
      # (the heap in chunks: lazily imported on AMD APUs and Intel, windows where that isn't possible - shader.h maxwell_gmem_chunk_shift)
      - name: Shader translator fuzz (GLSL, guest heap in chunks)
        run: TT_GMEM_CHUNK_SHIFT=24 REF=HEAD tools/test_translate.sh 2000 "$(nproc)" glsl
      - name: Shader translator fuzz (GLSL, guest heap in lazy chunks)
        run: TT_GMEM_CHUNK_SHIFT=24 TT_GMEM_LAZY=1 REF=HEAD tools/test_translate.sh 2000 "$(nproc)" glsl
      - name: Shader translator fuzz (GLSL, guest heap in lazy chunks, misses counted in every fragment shader)
        run: TT_GMEM_CHUNK_SHIFT=24 TT_GMEM_LAZY=1 TT_GMEM_FS_MISS=1 REF=HEAD tools/test_translate.sh 500 "$(nproc)" glsl
      - name: Vulkan synchronization failure regression
        run: python tools/test_vulkan_sync_errors.py

  # Windows on ARM (experimental builds): the same app build and Windows tests natively on an ARM64 runner, MSYS2
  # CLANGARM64 as tools/setup_windows.ps1 sets it up there. Left out: the x86 SIMD rounding test (-mfma) and the shader
  # translator fuzz (the same on every platform; the x64 job runs it). -pthread on every test (CC for the Python ones):
  # CLANGARM64's libraries don't pull winpthreads in for us, as the Makefile's -lpthread there.
  windows-arm64:
    runs-on: windows-11-arm
    env:
      CC: clang -pthread  # (the Python tests' compiler)
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: LF line endings, as tools/setup_windows.ps1 sets for clones
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANGARM64
          update: true
          install: make git
          pacboy: clang:p lld:p python:p sdl3:p ffmpeg:p vulkan-devel:p shaderc:p spirv-tools:p pkgconf:p
            vulkan-memory-allocator:p
      - name: App builds
        run: make -j"$(nproc)" build/lasrecomp.exe
      - name: Build cache and resume tests
        run: |
          python3 tools/test_build_cache.py
          python3 tools/test_gamebuild_resume.py
          python3 tools/test_windows_processes.py
      - name: Save I/O regression tests
        run: python3 tools/test_save.py
      - name: Game-files delete guard (junctions, outside the data folder)
        run: python3 tools/test_delete_guard.py
      - name: Data folder move (cut off at every step)
        run: python3 tools/test_data_move.py
      - name: Movie extractor lifecycle regression
        run: |
          clang -pthread -std=gnu11 -O1 tools/test_movie_extractor.c -lavformat -lavcodec -lavutil -lswscale -o build/test-movie-extractor.exe
          mkdir -p build/movie-test
          build/test-movie-extractor.exe build/movie-test
      - name: Kernel condition-variable regression
        run: |
          clang -O2 -pthread tools/test_condvar.c -o build/test-condvar.exe
          build/test-condvar.exe
      - name: Controller rumble (HID bridge to SDL, fake gamepad)
        run: |
          clang -pthread -std=gnu11 -O2 $(pkg-config --cflags sdl3) tools/test_rumble.c $(pkg-config --libs sdl3) -o build/test-rumble.exe
          build/test-rumble.exe
      - name: Controller in use (two virtual gamepads, #455)
        run: |
          clang -pthread -std=gnu11 -O2 $(pkg-config --cflags sdl3) tools/test_active_pad.c $(pkg-config --libs sdl3) -o build/test-active-pad.exe
          build/test-active-pad.exe
      - name: Vulkan fence sequence regression
        run: python tools/test_fence_sequence.py
      - name: Guest heap import on low-memory machines
        run: python tools/test_gmem_lowmem.py
      - name: Vulkan validation failure regression
        run: python tools/test_vulkan_validation.py
      - name: Vulkan overlay command buffer (recorder thread)
        run: python tools/test_vulkan_overlay.py
      - name: Windows guest thread stack regression
        run: |
          clang -pthread -std=gnu11 -O1 tools/test_windows_thread_stack.c -lpsapi -o build/test-thread-stack.exe
          build/test-thread-stack.exe
      - name: Windows lazy guest-memory commit race regression
        run: |
          clang -pthread -std=gnu11 -O1 -D_FILE_OFFSET_BITS=64 -D_POSIX_THREAD_SAFE_FUNCTIONS -DWIN32_LEAN_AND_MEAN -DNOMINMAX \
            tools/test_windows_lazy_commit.c -lwinmm -lole32 -lshell32 -o build/test-lazy-commit.exe
          build/test-lazy-commit.exe
      - name: Windows session log regression
        run: python tools/test_windows_logs.py
      - name: Vulkan synchronization failure regression
        run: python tools/test_vulkan_sync_errors.py

  # Android (arm64): the app (android/, libmain.so with the moving guest window) builds with the NDK, and the APK holds
  # only the runtime, SDL, shaderc and the shipped fonts and icon - nothing of the game, whose code is built on the
  # device from the player's own extracted files.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;30.0.16248370" "cmake;3.30.4" "platforms;android-36" > /dev/null
      - name: Dependencies cache
        id: deps
        uses: actions/cache@v4
        with:
          path: android/deps/out
          key: android-deps-${{ hashFiles('android/deps/build_deps.sh', 'android/deps/build_gen_deps.sh', 'android/gen/**') }}
      - name: Dependencies (SDL3, shaderc, volk, Vulkan headers; the game code builder)
        if: steps.deps.outputs.cache-hit != 'true'
        run: |
          bash android/deps/build_deps.sh
          bash android/deps/build_gen_deps.sh
      - name: App builds
        run: cd android && ./gradlew assembleDebug --console=plain
      # (the game code builder in assets/gen.zip: Python's library, the bindings, zig's lib/, the generator and the
      # headers - checked file by file too)
      - name: The APK holds no game files
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -Z1 "$APK" |
            grep -vE '^(META-INF/|res/|classes[0-9]*\.dex$|AndroidManifest\.xml$|resources\.arsc$|lib/arm64-v8a/lib(main|SDL3|shaderc_shared|pymain|python3\.14|capstone|unicorn|lz4|zig)\.so$|assets/gen\.zip$|assets/res/(Baloo2-SemiBold\.ttf|Baloo2-OFL\.txt|BIZUDPGothic-Regular\.ttf|BIZUDPGothic-OFL\.txt|DejaVuSans(-Bold)?\.ttf|DejaVu-LICENSE\.txt|icon\.png)$)' \
            > unexpected.txt || true
          unzip -p "$APK" assets/gen.zip > gen.zip && unzip -Z1 gen.zip |
            grep -vE '^(python/|site/|zig/|tools/(gen|lifter|analyze|nso|passes|patches|simd_c|game_addresses)\.py$|tools/(rando/)?$|tools/rando/patch_variants\.json$|runtime/(game_addresses/)?$|runtime/game_addresses/[a-z0-9_]+\.h$|gamelib-src/(cpu|simd|simd_fp|gamelib)\.h$|gamelib-src/gamelib_entry\.c$|gamelib-src/hle_symbols\.txt$|gamelib-src/$)' \
            | sed 's#^#gen.zip: #' >> unexpected.txt || true
          if [ -s unexpected.txt ]; then echo "unexpected files in the APK:"; cat unexpected.txt; exit 1; fi
