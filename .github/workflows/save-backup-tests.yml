name: Save backup tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backup-store:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_save_backups.py
      - run: python tools/test_save_mount.py
