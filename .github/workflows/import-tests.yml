name: Import and settings tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  synthetic-archives:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install zstandard==0.25.0
      - run: python tools/test_import_game.py -v
      - if: runner.os != 'Windows'
        run: python tools/test_settings_language.py
      - if: runner.os != 'Windows'
        run: python tools/test_ui_localization.py
