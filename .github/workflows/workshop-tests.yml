name: Workshop and frame statistics
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/test_workshop.py
      - run: python tools/test_research.py
      - run: python tools/test_research_analyze.py
      - run: python tools/test_research_stores.py
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-python
      - run: CC=gcc CXX=g++ python tools/test_workshop.py
      - run: CC=gcc CXX=g++ python tools/test_research.py
      - run: python tools/test_research_analyze.py
      - run: python tools/test_research_stores.py
