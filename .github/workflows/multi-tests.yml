name: Multi tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  extracted-game-setup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Windows native-test compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: clang:p lld:p
      - name: Use the app's UCRT64 compiler and pthread headers
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cygpath -w /ucrt64/bin >> "$GITHUB_PATH"
      - run: python -m pip install lz4
      - run: python tools/test_game_setup.py -v
      - run: python tools/test_game_versions.py -v
      - run: python tools/test_game_catalog.py -v
      - run: python tools/adapter.py check
      - run: python tools/test_adapter_contract.py -v
      - run: python tools/test_adapter_doctor.py -v
      - run: python tools/test_runtime_diagnostics.py -v
      - run: python tools/test_adapter_probe.py -v
      - run: python tools/test_game_install.py
      - run: python tools/test_exit_status.py
      - run: python tools/test_release_channel.py
      - if: runner.os != 'macOS'
        run: python tools/test_gpu_wait_timeout.py
      - if: runner.os != 'macOS'
        run: python tools/test_gpu_watchdog.py
      - if: runner.os != 'macOS'
        run: python tools/test_gpu_fence_wait.py
      - run: python tools/test_title_profile.py
      - run: python tools/test_romfs_source.py
      - run: python tools/test_crash_explain.py
      - run: python tools/test_sdk_start.py
      - run: python tools/test_kernel_info.py
      - run: python tools/test_kernel_memory.py
      - run: python tools/test_platform_memory.py
      - run: python tools/test_nvn_sampler.py
      - run: python tools/test_nvn_views.py
      - run: python tools/test_tipc.py
      - run: python tools/test_am_events.py
      - run: python tools/test_game_profiles.py
      - run: python tools/test_save_multicommit.py
      - if: runner.os == 'macOS'
        run: python tools/test_fence_sequence.py
      - run: python tools/test_texture_retirement.py
      - run: python tools/test_pipeline_cache_snapshot.py
      - run: python tools/test_feedback_snapshot.py
      - run: python tools/test_nvn_present_interval.py
      - run: python tools/test_acnh_speedfix.py
      - run: python tools/test_frame_pacing.py
      - run: python tools/test_shader_ldc.py
      - if: runner.os != 'Windows'
        run: python tools/test_shader_shared.py
      - run: python tools/test_shader_tmml.py
      - run: python tools/test_shader_gmem.py
      - run: python tools/test_time_override.py
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 -Iruntime tools/test_touch.c -o test-touch && ./test-touch
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 -Iruntime tools/test_prepo.c -o test-prepo && ./test-prepo
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 -Iruntime tools/test_olsc.c -o test-olsc && ./test-olsc
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 -Iruntime tools/test_bcat.c -o test-bcat && ./test-bcat
      - run: clang -std=gnu11 -O1 tools/test_audio_biquad.c -o test-audio-biquad
      - run: ./test-audio-biquad
      - run: clang -std=gnu11 -O1 tools/test_audio_workbuffer.c -o test-audio-workbuffer
      - run: ./test-audio-workbuffer
      - run: clang -std=gnu11 -O1 tools/test_audio_splitter.c -o test-audio-splitter
      - run: ./test-audio-splitter
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 tools/test_nvn_pool_mapping.c -o test-nvn-pool && ./test-nvn-pool
      - if: runner.os != 'Windows'
        run: clang -std=gnu11 -O1 -Iruntime tools/test_time_service.c -o test-time && ./test-time
      - if: runner.os == 'Windows'
        run: python tools/test_game_shortcut.py
      - run: python tools/test_rando_event_compat.py -v
      - if: runner.os != 'Windows'
        run: python tools/test_save_backups.py
      - if: runner.os != 'Windows'
        run: python tools/test_settings_language.py
      - if: runner.os != 'Windows'
        run: python tools/test_ui_localization.py
      - if: runner.os != 'Windows'
        run: python tools/test_rando_profiles.py -v
      - run: python tools/test_mods.py
      - if: runner.os != 'Windows'
        run: python tools/test_photo.py
      - if: runner.os != 'Windows'
        run: python tools/test_save_mount.py
      - run: python tools/test_workshop.py
